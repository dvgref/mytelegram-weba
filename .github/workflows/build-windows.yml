name: build-windows

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npx webpack
        env:
          TELEGRAM_API_ID: "2040"
          TELEGRAM_API_HASH: "b18441a1ff607e10a989891a5462e627"

      - name: Copy dist into tauri folder
        shell: pwsh
        run: |
          if (Test-Path tauri\dist) { Remove-Item -Recurse -Force tauri\dist }
          New-Item -ItemType Directory -Force -Path tauri\dist | Out-Null
          Copy-Item -Path dist\* -Destination tauri\dist -Recurse -Force
          Write-Host "=== tauri\dist contents ==="
          Get-ChildItem tauri\dist | Select-Object -First 10 Name
          if (Test-Path tauri\dist\index.html) { Write-Host "index.html: OK" } else { Write-Host "index.html: MISSING"; exit 1 }

      - name: Force re-embed frontend (clear stale app cache)
        working-directory: tauri
        shell: pwsh
        run: cargo clean -p telegram_air

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          APP_ENV: production

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wavegram-windows-installer
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
